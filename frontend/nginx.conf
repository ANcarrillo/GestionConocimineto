server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos CSV de carga masiva
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: /api/estudiantes -> http://backend:8000/estudiantes
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # la predicción por lote puede tardar
    }

    # El service worker y el index no se guardan en caché para que las actualizaciones lleguen
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Archivos compilados (llevan hash en el nombre): caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de React Router (/estudiantes/12, /alertas…) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
