# Despliegue con Docker: base de datos + API + interfaz web
#   1. Copie .env.docker.example como .env y cambie las claves
#   2. docker compose up -d --build
#   3. Abra http://localhost:8080
name: sat-desercion

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: desercion_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
      TZ: America/Bogota
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (cuando el volumen está vacío), en orden alfabético
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/roles_y_usuarios.sql:/docker-entrypoint-initdb.d/02_roles_y_usuarios.sql:ro
      - ./database/${DATOS_INICIALES:-datos_prueba.sql}:/docker-entrypoint-initdb.d/03_datos.sql:ro
    ports:
      # 5433 en el PC para no chocar con un PostgreSQL instalado localmente (5432)
      - "${PUERTO_DB:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d desercion_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/desercion_db
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en el archivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MODELS_DIR: /app/modelos
      CAPTCHA_HABILITADO: ${CAPTCHA_HABILITADO:-true}
      TZ: America/Bogota
    volumes:
      # Modelos entrenados en ml/ (se registran y activan desde la web: Modelo ML)
      - ./ml/models:/app/modelos:ro
    ports:
      # Swagger: http://localhost:8001/docs
      - "${PUERTO_API:-8001}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUERTO_WEB:-8080}:80"

volumes:
  datos_postgres:
